<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>盛昱室內裝修有限公司｜公司管理系統</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2f5d50;--accent2:#e8f0ed;--danger:#b91c1c;--shadow:0 6px 18px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
.app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.96);backdrop-filter:blur(8px);padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:800}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
main{padding:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);padding:14px;border-radius:16px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;margin-top:6px}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.qbtn{border:0;border-radius:14px;padding:14px 8px;background:var(--accent);color:white;font-weight:700}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.section-title h2{font-size:17px;margin:0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px}
.row{display:flex;justify-content:space-between;gap:12px;margin:6px 0;font-size:14px}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:700}
.progress{height:8px;background:#edf0f2;border-radius:999px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:var(--accent)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bottom .bar{width:min(640px,100%);display:grid;grid-template-columns:repeat(4,1fr)}
.nav{border:0;background:#fff;padding:12px 6px;color:var(--muted);font-size:12px}
.nav.active{color:var(--accent);font-weight:800}
.nav span{display:block;font-size:20px;margin-bottom:2px}
.page{display:none}.page.active{display:block}
.form label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}
.form textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:16px}
.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px 14px;font-weight:800}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:#e9ecef;color:var(--text)}
.danger{background:#fee2e2;color:var(--danger)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.detail-head{background:linear-gradient(135deg,#2f5d50,#3e7565);color:white;border-radius:18px;padding:16px;margin-bottom:12px}
.detail-head h2{margin:0 0 8px}
.money{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:18px;bottom:86px;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:white;font-size:28px;box-shadow:0 8px 20px rgba(47,93,80,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-start;justify-content:center}
.modal.open{display:flex}
.sheet{
  width:min(640px,100%);
  height:100dvh;
  max-height:100dvh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scroll-padding-top:76px;
  scroll-padding-bottom:45vh;
  background:var(--bg);
  border-radius:0;
  padding:0 14px max(120px,calc(20px + env(safe-area-inset-bottom)));
}
.sheet-head{
  position:sticky;
  top:0;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 -14px 8px;
  padding:14px;
  background:rgba(245,246,248,.98);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.sheet .form{padding-bottom:40vh}
.sheet-head h3{margin:0}
.close{border:0;background:#e5e7eb;border-radius:50%;width:34px;height:34px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">盛昱室內裝修有限公司</div>
  <div class="sub">公司管理系統 V1｜手機版</div>
</header>

<main>
<section id="home" class="page active">
  <div class="grid4">
    <div class="stat"><div class="k">進行中工程</div><div class="v" id="statProjects">0</div></div>
    <div class="stat"><div class="k">本月已收</div><div class="v money" id="statIncome">$0</div></div>
    <div class="stat"><div class="k">待收款</div><div class="v money" id="statDue">$0</div></div>
    <div class="stat"><div class="k">本月支出</div><div class="v money" id="statExpense">$0</div></div>
  </div>

  <div class="quick">
    <button class="qbtn" onclick="openQuick('project')">＋工程</button>
    <button class="qbtn" onclick="openQuick('income')">＋收款</button>
    <button class="qbtn" onclick="openQuick('expense')">＋支出</button>
  </div>

  <div class="section-title"><h2>進行中工程</h2><button class="linkbtn" onclick="showPage('projects')">查看全部</button></div>
  <div id="homeProjects"></div>

  <div class="section-title"><h2>最近紀錄</h2></div>
  <div id="recentLogs"></div>
</section>

<section id="projects" class="page">
  <div class="section-title"><h2>工程案件</h2><button class="linkbtn" onclick="openQuick('project')">＋新增</button></div>
  <div id="projectList"></div>
</section>

<section id="detail" class="page">
  <div id="detailWrap"></div>
</section>

<section id="more" class="page">
  <div class="section-title"><h2>更多功能</h2></div>
  <div class="card">
    <div class="row"><span>客戶管理</span><span class="muted">下一版擴充</span></div>
    <div class="row"><span>廠商管理</span><span class="muted">下一版擴充</span></div>
    <div class="row"><span>照片與文件</span><span class="muted">下一版擴充</span></div>
    <div class="row"><span>帳號權限／雲端同步</span><span class="muted">正式版接入</span></div>
  </div>
  <div class="card">
    <h3>資料管理</h3>
    <p class="muted">目前資料儲存在這支手機的瀏覽器內。</p>
    <button class="danger" onclick="resetData()">清除全部測試資料</button>
  </div>
</section>
</main>
</div>

<nav class="bottom">
  <div class="bar">
    <button class="nav active" data-page="home" onclick="showPage('home')"><span>⌂</span>首頁</button>
    <button class="nav" data-page="projects" onclick="showPage('projects')"><span>▣</span>工程</button>
    <button class="nav" onclick="openQuick('menu')"><span>＋</span>新增</button>
    <button class="nav" data-page="more" onclick="showPage('more')"><span>☰</span>更多</button>
  </div>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
  <div class="sheet">
    <div class="sheet-head"><h3 id="modalTitle">新增</h3><button class="close" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const LS='shengyu_manager_v1';
let db=JSON.parse(localStorage.getItem(LS)||'{"projects":[],"incomes":[],"expenses":[],"progress":[]}');
let currentProjectId=null;
const save=()=>{localStorage.setItem(LS,JSON.stringify(db));renderAll();}
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const today=()=>new Date().toISOString().slice(0,10);
const ym=d=>(d||'').slice(0,7);
const thisMonth=()=>today().slice(0,7);

function showPage(p){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(p).classList.add('active');
 document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));
 if(p==='home'||p==='projects') renderAll();
 window.scrollTo({top:0,behavior:'smooth'});
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function modal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function projectOptions(){
 return db.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
}
function openQuick(type){
 if(type==='menu'){
   modal('新增紀錄',`<div class="quick">
   <button class="qbtn" onclick="openQuick('project')">＋工程</button>
   <button class="qbtn" onclick="openQuick('income')">＋收款</button>
   <button class="qbtn" onclick="openQuick('expense')">＋支出</button>
   </div><button class="primary" onclick="openQuick('progress')">＋更新工程進度</button>`);
   return;
 }
 if(type==='project'){
  modal('新增工程',`<form class="form" onsubmit="addProject(event)">
   <label>工程名稱 *</label><input name="name" required placeholder="例如：王宅室內裝修工程">
   <label>客戶／公司名稱</label><input name="client" placeholder="例如：王先生／○○有限公司">
   <label>聯絡人</label><input name="contact" placeholder="例如：王先生">
   <label>聯絡電話</label><input name="phone" inputmode="tel" placeholder="09xx-xxx-xxx">
   <label>工程地址</label><input name="address">
   <label>合約金額</label><input name="contract" inputmode="numeric" type="number" min="0">
   <label>開工日期</label><input name="start" type="date">
   <label>預計完工日期</label><input name="end" type="date">
   <label>負責人</label><input name="owner">
   <label>工程狀態</label><select name="status"><option>洽談中</option><option selected>施工中</option><option>完工</option><option>保固中</option></select>
   <label>備註</label><textarea name="note"></textarea>
   <div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">儲存工程</button></div>
  </form>`); return;
 }
 if(!db.projects.length){alert('請先建立工程案件。');openQuick('project');return;}
 if(type==='income'){
  modal('新增收款',`<form class="form" onsubmit="addIncome(event)">
   <label>工程 *</label><select name="projectId" required>${projectOptions()}</select>
   <label>收款項目</label><select name="type"><option>訂金</option><option>一期款</option><option>二期款</option><option>尾款</option><option>追加款</option><option>其他</option></select>
   <label>金額 *</label><input name="amount" type="number" inputmode="numeric" min="0" required>
   <label>收款日期</label><input name="date" type="date" value="${today()}">
   <label>備註</label><textarea name="note"></textarea>
   <div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">儲存收款</button></div>
  </form>`); return;
 }
 if(type==='expense'){
  modal('新增支出',`<form class="form" onsubmit="addExpense(event)">
   <label>工程 *</label><select name="projectId" required>${projectOptions()}</select>
   <label>類別</label><select name="type"><option>材料</option><option>工資</option><option>外包</option><option>運費</option><option>雜支</option></select>
   <label>廠商／對象</label><input name="vendor">
   <label>金額 *</label><input name="amount" type="number" inputmode="numeric" min="0" required>
   <label>支出日期</label><input name="date" type="date" value="${today()}">
   <label>備註</label><textarea name="note"></textarea>
   <div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">儲存支出</button></div>
  </form>`); return;
 }
 if(type==='progress'){
  modal('更新工程進度',`<form class="form" onsubmit="addProgress(event)">
   <label>工程 *</label><select name="projectId" required>${projectOptions()}</select>
   <label>目前進度 %</label><input name="percent" type="number" min="0" max="100" value="0">
   <label>今日完成內容</label><textarea name="done"></textarea>
   <label>下一步施工</label><textarea name="next"></textarea>
   <label>日期</label><input name="date" type="date" value="${today()}">
   <div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">儲存進度</button></div>
  </form>`);
 }
}
function formObj(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}
function addProject(e){let x=formObj(e);db.projects.push({id:id(),...x,contract:+x.contract||0,created:Date.now()});save();closeModal();showPage('projects')}
function addIncome(e){let x=formObj(e);db.incomes.push({id:id(),...x,amount:+x.amount||0,created:Date.now()});save();closeModal();if(currentProjectId) openProject(currentProjectId)}
function addExpense(e){let x=formObj(e);db.expenses.push({id:id(),...x,amount:+x.amount||0,created:Date.now()});save();closeModal();if(currentProjectId) openProject(currentProjectId)}
function addProgress(e){let x=formObj(e);db.progress.push({id:id(),...x,percent:+x.percent||0,created:Date.now()});save();closeModal();if(currentProjectId) openProject(currentProjectId)}
function pTotals(pid){
 const income=db.incomes.filter(x=>x.projectId===pid).reduce((s,x)=>s+x.amount,0);
 const expense=db.expenses.filter(x=>x.projectId===pid).reduce((s,x)=>s+x.amount,0);
 const pr=[...db.progress].filter(x=>x.projectId===pid).sort((a,b)=>b.created-a.created)[0];
 return {income,expense,progress:pr?pr.percent:0};
}
function projectCard(p){
 const t=pTotals(p.id), due=Math.max(0,(+p.contract||0)-t.income);
 return `<div class="card" onclick="openProject('${p.id}')">
  <div class="row"><h3>${p.name}</h3><span class="badge">${p.status}</span></div>
  <div class="row"><span class="muted">客戶</span><span>${p.client||'—'}</span></div>
  <div class="row"><span class="muted">合約</span><b class="money">${money(p.contract)}</b></div>
  <div class="row"><span class="muted">已收 / 待收</span><span>${money(t.income)} / ${money(due)}</span></div>
  <div class="row"><span class="muted">累計支出</span><span>${money(t.expense)}</span></div>
  <div class="row"><span class="muted">工程進度</span><span>${t.progress}%</span></div>
  <div class="progress"><i style="width:${t.progress}%"></i></div>
 </div>`;
}
function openProject(pid){
 currentProjectId=pid;
 const p=db.projects.find(x=>x.id===pid); if(!p)return;
 const t=pTotals(pid), due=Math.max(0,(+p.contract||0)-t.income);
 const inc=[...db.incomes].filter(x=>x.projectId===pid).sort((a,b)=>b.created-a.created);
 const exp=[...db.expenses].filter(x=>x.projectId===pid).sort((a,b)=>b.created-a.created);
 const prog=[...db.progress].filter(x=>x.projectId===pid).sort((a,b)=>b.created-a.created);
 document.getElementById('detailWrap').innerHTML=`
 <button class="linkbtn" onclick="showPage('projects')">‹ 返回工程</button>
 <div class="detail-head"><h2>${p.name}</h2><div>${p.status}｜${p.client||'未填客戶'}</div></div>
 <div class="grid4">
  <div class="stat"><div class="k">合約金額</div><div class="v">${money(p.contract)}</div></div>
  <div class="stat"><div class="k">已收款</div><div class="v">${money(t.income)}</div></div>
  <div class="stat"><div class="k">待收款</div><div class="v">${money(due)}</div></div>
  <div class="stat"><div class="k">累計支出</div><div class="v">${money(t.expense)}</div></div>
 </div>
 <div class="section-title"><h2>工程資料</h2></div>
 <div class="card">
  <div class="row"><span class="muted">地址</span><span>${p.address||'—'}</span></div>
  <div class="row"><span class="muted">負責人</span><span>${p.owner||'—'}</span></div>
  <div class="row"><span class="muted">開工</span><span>${p.start||'—'}</span></div>
  <div class="row"><span class="muted">預計完工</span><span>${p.end||'—'}</span></div>
  <div class="row"><span class="muted">目前進度</span><b>${t.progress}%</b></div>
  <div class="progress"><i style="width:${t.progress}%"></i></div>
 </div>
 <div class="quick">
  <button class="qbtn" onclick="openQuick('income')">＋收款</button>
  <button class="qbtn" onclick="openQuick('expense')">＋支出</button>
  <button class="qbtn" onclick="openQuick('progress')">＋進度</button>
 </div>
 <div class="section-title"><h2>最近收款</h2></div>${inc.length?inc.slice(0,5).map(x=>`<div class="card"><div class="row"><b>${x.type}</b><b>${money(x.amount)}</b></div><div class="muted">${x.date||''} ${x.note||''}</div></div>`).join(''):'<div class="empty">尚無收款紀錄</div>'}
 <div class="section-title"><h2>最近支出</h2></div>${exp.length?exp.slice(0,5).map(x=>`<div class="card"><div class="row"><b>${x.type}${x.vendor?'｜'+x.vendor:''}</b><b>${money(x.amount)}</b></div><div class="muted">${x.date||''} ${x.note||''}</div></div>`).join(''):'<div class="empty">尚無支出紀錄</div>'}
 <div class="section-title"><h2>工程進度</h2></div>${prog.length?prog.slice(0,5).map(x=>`<div class="card"><div class="row"><b>${x.percent}%</b><span>${x.date||''}</span></div><div>${x.done||'—'}</div>${x.next?`<div class="muted" style="margin-top:6px">下一步：${x.next}</div>`:''}</div>`).join(''):'<div class="empty">尚無進度紀錄</div>'}
 `;
 showPage('detail');
}
function renderAll(){
 const active=db.projects.filter(p=>p.status==='施工中');
 document.getElementById('statProjects').textContent=active.length;
 const m=thisMonth();
 const income=db.incomes.filter(x=>ym(x.date)===m).reduce((s,x)=>s+x.amount,0);
 const expense=db.expenses.filter(x=>ym(x.date)===m).reduce((s,x)=>s+x.amount,0);
 const due=db.projects.reduce((s,p)=>s+Math.max(0,(+p.contract||0)-pTotals(p.id).income),0);
 document.getElementById('statIncome').textContent=money(income);
 document.getElementById('statExpense').textContent=money(expense);
 document.getElementById('statDue').textContent=money(due);
 document.getElementById('homeProjects').innerHTML=active.length?active.slice(0,4).map(projectCard).join(''):'<div class="empty">尚未建立施工中工程</div>';
 document.getElementById('projectList').innerHTML=db.projects.length?db.projects.slice().sort((a,b)=>b.created-a.created).map(projectCard).join(''):'<div class="empty">尚未建立工程<br><br><button class="primary" onclick="openQuick(\'project\')">建立第一個工程</button></div>';
 const logs=[
  ...db.incomes.map(x=>({created:x.created,text:'收款｜'+(db.projects.find(p=>p.id===x.projectId)?.name||'工程'),amt:x.amount})),
  ...db.expenses.map(x=>({created:x.created,text:'支出｜'+(db.projects.find(p=>p.id===x.projectId)?.name||'工程'),amt:-x.amount})),
  ...db.progress.map(x=>({created:x.created,text:'進度｜'+(db.projects.find(p=>p.id===x.projectId)?.name||'工程')+' '+x.percent+'%',amt:null}))
 ].sort((a,b)=>b.created-a.created).slice(0,5);
 document.getElementById('recentLogs').innerHTML=logs.length?logs.map(x=>`<div class="card"><div class="row"><span>${x.text}</span>${x.amt===null?'':`<b>${x.amt<0?'-':''}${money(Math.abs(x.amt))}</b>`}</div></div>`).join(''):'<div class="empty">還沒有紀錄</div>';
}
function resetData(){
 if(confirm('確定要清除全部測試資料嗎？此動作無法復原。')){db={projects:[],incomes:[],expenses:[],progress:[]};save();showPage('home')}
}

// iPhone / 手機鍵盤開啟時，讓正在輸入的欄位自動滑到可見位置
document.addEventListener('focusin', function(e){
  if(!e.target.matches('.sheet input,.sheet select,.sheet textarea')) return;
  setTimeout(function(){
    e.target.scrollIntoView({behavior:'smooth', block:'center'});
  }, 250);
});

renderAll();
</script>
</body>
</html>
